<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Made-to-Order Furniture Quote | Crafted Wood Carpentry</title>
<meta name="description" content="Request a quote for made-to-order wooden furniture, doors, cupboards or restoration. Tell us about your project and get an estimated cost and lead time.">
<meta name="keywords" content="made-to-order wooden furniture, custom furniture Pretoria, affordable wooden furniture Pretoria, custom wooden furniture Soshanguve">
</head>
<body>
    <header>
         <div class="logo">Crafted Wood Carpentry</div>
         <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="enquiry.html">Enquiry</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
    </header>
    <section class="enquiry-content">
  <h1>Make an Enquiry</h1>
  <p>Fill out the form below and we'll get back to you about your custom piece.</p>

 <form id="enquiry-form" novalidate>
  <label for="name">Full Name</label>
  <input type="text" id="name" name="name" required minlength="2" autocomplete="name">

  <label for="email">Email Address</label>
  <input type="email" id="email" name="email" required autocomplete="email">

  <label for="phone">Phone Number (optional)</label>
  <input type="tel" id="phone" name="phone" pattern="0[0-9]{9}" title="10 digits starting with 0, e.g. 0821234567" autocomplete="tel">

  <label for="service">Type of Enquiry</label>
  <select id="service" name="service" required>
    <option value="">Choose a service</option>
    <option value="furniture">Custom Furniture</option>
    <option value="doors">Doors and Cupboards</option>
    <option value="restoration">Restoration and Repairs</option>
  </select>

  <label for="quantity">Number of items</label>
  <input type="number" id="quantity" name="quantity" min="1" max="20" value="1" required>

  <fieldset class="radio-group">
    <legend>When do you need it?</legend>
    <label><input type="radio" name="timeline" value="flexible"> I'm flexible</label>
    <label><input type="radio" name="timeline" value="month"> Within a month</label>
    <label><input type="radio" name="timeline" value="urgent"> Urgent</label>
  </fieldset>
  <span id="timeline-error" class="error-message"></span>

  <div class="checkbox-row">
    <label><input type="checkbox" id="site-visit" name="site_visit"> I would like a site visit</label>
  </div>

  <label for="message">Tell us about your project</label>
  <textarea id="message" name="message" rows="5" required minlength="10"></textarea>

  <button type="submit">Submit Enquiry</button>
  <div id="enquiry-response" role="status" aria-live="polite" hidden></div>
</form>
</section>
<script src="enquiry.js" defer></script>
</body>
</html>
